services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quecomerenloja-app
    restart: always
    ports:
      - "3006:3006"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3006
      - HOSTNAME=0.0.0.0
